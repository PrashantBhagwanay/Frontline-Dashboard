<div class="min-h-screen bg-slate-50 text-slate-800 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-xl border shadow-sm flex flex-col items-center px-8 py-10 text-center">

        <div class="w-[140px] h-[35px] flex items-center justify-center overflow-hidden mb-10">
            <img src="assets/logo.png" alt="Smiths News" class="h-10 w-auto object-contain scale-[4]" />
        </div>

        @if (errorMessage()) {
        <h1 class="text-lg font-extrabold text-red-700 mb-2">Authentication Failed</h1>
        <p class="text-sm text-slate-600 mb-6">{{ errorMessage() }}</p>
        <button (click)="goToLogin()"
            class="w-full bg-yellow-300 hover:bg-yellow-400 transition-colors rounded-md py-3 text-sm font-extrabold uppercase tracking-wider text-slate-900">
            Back to Login
        </button>
        } @else {
        <h1 class="text-lg font-extrabold text-slate-900 mb-2 animate-pulse">
            Signing you in...
        </h1>
        <p class="text-[11px] font-semibold uppercase text-slate-500">
            Please wait
        </p>
        }

    </div>
</div>
